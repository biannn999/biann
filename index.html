<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login Pelatih & Admin</title>
    <style>
        /* Reset dasar agar tampilan rapi di semua browser */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Background biru langit bercampur putih lembut */
            background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 50%, #bae6fd 100%);
            padding: 20px;
            overflow: hidden;
        }

        /* Animasi masuk: meluncur (slide) dari bawah */
        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Animasi kilat cahaya melintasi lingkaran */
        @keyframes shine {
            0% {
                left: -150%;
            }
            50% {
                left: 150%;
            }
            100% {
                left: 150%;
            }
        }

        /* Kotak Login Mengambang */
        .login-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 30px;
            width: 100%;
            max-width: 400px; /* Lebar maksimal box agar tetap pas di PC */
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            position: relative;
            
            /* Menjalankan animasi masuk */
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Lingkaran Atas Grafis */
        .avatar-container {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #7dd3fc, #38bdf8);
            border-radius: 50%;
            margin: 0 auto 25px auto;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
        }

        /* Ikon user SVG putih di dalam lingkaran */
        .avatar-container svg {
            width: 45px;
            height: 45px;
            fill: white;
            position: relative;
            z-index: 2;
        }

        /* Efek Mengkilap Terang */
        .avatar-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.6) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            animation: shine 3.5s infinite ease-in-out;
            z-index: 3;
        }

        .login-box h2 {
            color: #0369a1;
            font-size: 1.6rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .login-box p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* Form Grup Kolom Mini */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #0369a1;
            margin-bottom: 6px;
            margin-left: 4px;
            font-weight: 600;
        }

        /* Desain Kolom Pilihan & Kolom Password */
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            background-color: rgba(248, 250, 252, 0.8);
            color: #334155;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
            appearance: none; /* Menghapus panah default bawaan sistem gadget */
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        /* Pembungkus menu pilihan untuk memberi tanda panah kustom */
        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▼';
            font-size: 0.75rem;
            color: #0369a1;
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* Efek Focus Glow yang Soft */
        .input-field:focus {
            border-color: #38bdf8;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        /* Tombol Submit */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
            background: linear-gradient(135deg, #0ea5e9, #0369a1);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Responsivitas Layar Sangat Kecil (Mobile Responsive) */
        @media (max-width: 400px) {
            .login-box {
                padding: 30px 20px;
            }
            .login-box h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- Box Login Mengambang -->
    <div class="login-box">
        
        <!-- Lingkaran Atas dengan Efek Mengkilap -->
        <div class="avatar-container">
            <svg viewBox="0 0 24 24">
                <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
            </svg>
        </div>

        <h2>Selamat Datang</h2>
        <p>Silakan masuk ke akun Pelatih atau Admin</p>

        <!-- Form Input -->
        <form id="loginForm">
            <!-- Kolom Pilihan Akses (Dropdown) -->
            <div class="input-group">
                <label for="role">Login Sebagai</label>
                <div class="select-wrapper">
                    <select id="role" class="input-field" required>
                        <option value="" disabled selected hidden>-- Pilih Jabatan Akun --</option>
                        <option value="Pelatih">Pelatih</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
            </div>

            <!-- Kolom Password -->
            <div class="input-group">
                <label for="password">Password Akun</label>
                <input type="password" id="password" class="input-field" placeholder="••••••••" required>
            </div>

            <!-- Tombol Submit -->
            <button type="submit" class="btn-login">Masuk Aplikasi</button>
        </form>
    </div>

    <!-- JavaScript untuk Validasi Login -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            // Mencegah halaman reload otomatis saat form dikirim
            event.preventDefault(); 

            // Mengambil nilai pilihan jabatan dan isi password
            const selectedRole = document.getElementById('role').value;
            const passwordInput = document.getElementById('password').value;

            // Validasi kelengkapan isian
            if (!selectedRole || passwordInput.trim() === "") {
                alert("Harap tentukan jabatan akun dan isi password Anda!");
                return;
            }

            // Simulasi pencocokan akun sederhana
            // Anda dapat mengubah string password di bawah sesuai kebutuhan
            if (selectedRole === "Admin" && passwordInput === "admin123") {
                alert("Login Berhasil!\nSelamat datang kembali, Pengelola Sistem (Admin).");
                // window.location.href = "halaman_admin.html"; // Aktifkan jika ada file tujuan redirect
            } else if (selectedRole === "Pelatih" && passwordInput === "pelatih123") {
                alert("Login Berhasil!\nSelamat datang kembali, Pelatih.");
                // window.location.href = "halaman_pelatih.html"; // Aktifkan jika ada file tujuan redirect
            } else {
                alert("Login Gagal! Kombinasi password untuk " + selectedRole + " tidak sesuai.");
            }
        });
    </script>
</body>
</html>

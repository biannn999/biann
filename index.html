<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi pelatih ekstrakulikuler olahraga</title>
    <!-- Menghubungkan ke file CSS Eksternal (Outline CSS) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Box Login Mengambang -->
    <div class="login-box" style="animation-delay: 0.1s;">
        
        <!-- ======================================================== -->
        <!-- ➕ SISIPKAN KODE BARU POP-UP INI DI SINI -->
        <!-- ======================================================== -->
        <div id="successPopup" class="popup-inside">
            <div class="popup-content">
                <div class="success-icon">✓</div>
                <h3>Login Berhasil!</h3>
                <p id="successMessage">Selamat datang kembali.</p>
                <button type="button" class="btn-popup" onclick="closePopup()">Lanjutkan</button>
            </div>
        </div>

    <!-- Box Login Mengambang -->
    <!-- Inline CSS digunakan di sini untuk mengatur durasi custom jika diperlukan -->
    <div class="login-box" style="animation-delay: 0.1s;">
        
        <!-- Lingkaran Atas dengan Efek Mengkilap -->
        <div class="avatar-container">
            <svg viewBox="0 0 24 24">
                <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
            </svg>
        </div>

        <h2>BAGIAN OLAHRAGA</h2>
        <p style="margin-bottom: 25px;">Silakan masuk ke akun Pelatih atau Admin</p>

        <!-- Form Input -->
        <form id="loginForm">
            <!-- Kolom Pilihan Akses (Sistem Select / Dropdown) -->
            <div class="input-group">
                <label for="role">Login Sebagai</label>
                <div class="select-wrapper">
                    <select id="role" class="input-field" required>
                        <option value="" disabled selected hidden>-- Pilih Akun Anda --</option>
                        <option value="Pelatih">Pelatih</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
            </div>

            <!-- Kolom Password -->
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="input-field" placeholder="••••••••" required>
            </div>

            <!-- Tombol Submit -->
            <!-- Inline CSS digunakan untuk memberikan visual tebal pada teks tombol -->
            <button type="submit" class="btn-login" style="letter-spacing: 0.5px;">Masuk</button>
        </form>
    </div>

    <!-- Menghubungkan ke file JavaScript Eksternal -->
    <script src="script.js"></script>
</body>
</html>
